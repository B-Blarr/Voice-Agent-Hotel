name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  database:
    name: Database
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # A fresh PostgreSQL 16, like the n8n stack on the server.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: n8n
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: n8n
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U n8n"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: n8n
      PGPASSWORD: ci

    steps:
      - uses: actions/checkout@v7

      # Every migration in order, like on the server. 001, 010 and 011 set passwords
      # with \password, which needs a keyboard, so CI sets throwaway ones.
      - name: Apply migrations
        run: |
          for f in sql/0*.sql; do
            echo "::group::$f"
            case "$f" in
              sql/001_*|sql/002_*) db=n8n ;;
              *) db=hotel ;;
            esac
            sed "s/^\\\\password \\([a-z_]*\\)$/ALTER ROLE \\1 PASSWORD 'ci';/" "$f" \
              | psql -v ON_ERROR_STOP=1 -d "$db" -f -
            echo "::endgroup::"
          done

      - name: Run SQL tests
        run: |
          for f in tests/*.sql; do
            echo "::group::$f"
            psql -v ON_ERROR_STOP=1 -d hotel -f "$f"
            echo "::endgroup::"
          done
  api:
    name: API
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # The same fresh PostgreSQL 16 as in the job Database.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: n8n
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: n8n
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U n8n"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: n8n
      PGPASSWORD: ci
      # What api/.env holds locally. Throwaway values, only valid inside this job.
      SECRET_KEY: ci-only-not-a-secret
      DB_HOST: localhost
      DB_PORT: 5432
      TEAM_DB_PASSWORD: ci
      HOTEL_DB_PASSWORD: ci
      TEST_DB_SUPERUSER_PASSWORD: ci

    steps:
      - uses: actions/checkout@v7

      # The hotel schema comes from sql/, exactly like in the job Database.
      - name: Apply migrations
        run: |
          for f in sql/0*.sql; do
            case "$f" in
              sql/001_*|sql/002_*) db=n8n ;;
              *) db=hotel ;;
            esac
            sed "s/^\\\\password \\([a-z_]*\\)$/ALTER ROLE \\1 PASSWORD 'ci';/" "$f" \
              | psql -v ON_ERROR_STOP=1 -q -d "$db" -f - > /dev/null
          done

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r api/requirements-dev.txt

      # Django's own tables (users, sessions) in the database team.
      - name: Migrate Django
        working-directory: api
        run: python manage.py migrate

      - name: Run API tests
        working-directory: api
        run: python -m pytest
        
  hygiene:
    name: Hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

    steps:
      # The whole history, not just the last commit: a secret stays readable
      # in an old commit even after a later commit deletes it.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Tool definitions and workflow exports are edited by hand now and then.
      - name: Check JSON files
        run: |
          status=0
          while IFS= read -r -d '' f; do
            jq empty "$f" || { echo "::error file=$f::Not valid JSON"; status=1; }
          done < <(git ls-files -z '*.json')
          exit "$status"

      # A fixed version, checked against its SHA-256 before it runs.
      - name: Install gitleaks
        run: |
          cd "$RUNNER_TEMP"
          curl -sSLf -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks

      # Known false positives are listed by fingerprint in .gitleaksignore.
      - name: Scan history for secrets
        run: '"$RUNNER_TEMP/gitleaks" git . --redact --verbose --no-banner'
