# n8n.benjaminblarr.de
# Only the webhook path is reachable from outside. The editor stays closed
# and is opened through an SSH tunnel
# (ssh -N -L 15678:127.0.0.1:5678 vps, then http://localhost:15678).
# On the VPS: /etc/nginx/sites-available/n8n
# certbot adds the HTTPS part afterwards.

server {
    listen 80;
    listen [::]:80;
    server_name n8n.benjaminblarr.de;

    client_max_body_size 1M;

    access_log /var/log/nginx/n8n.access.log;
    error_log  /var/log/nginx/n8n.error.log;

    # Production webhooks only, i.e. published workflows.
    location /webhook/ {
        proxy_pass http://127.0.0.1:5678;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 30s;
    }

    # Everything else, including the editor, login and /healthz, does not exist from outside.
    location / {
        return 404;
    }
}
